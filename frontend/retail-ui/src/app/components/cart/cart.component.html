<div class="container mt-4 mb-4">
  <h2 class="mb-3">Your Shopping Cart</h2>

  <div *ngIf="cart?.cartItems?.length; else emptyCart">
    <div class="cart-item d-flex justify-content-between align-items-center mb-2" *ngFor="let item of cart?.cartItems">
      <div class="d-flex align-items-center gap-3">
        <div class="product-icon">🍕</div>
        <div>
          <h4>{{ item.product?.productName }}</h4>
          <p class="mb-0 text-secondary">Price: ${{ item.unitPrice | number:'1.2-2' }}</p>
        </div>
      </div>
      <div class="d-flex align-items-center gap-3">
        <span class="quantity-badge">Qty: {{ item.quantity }}</span>
        <span class="price">Total: ${{ item.totalPrice | number:'1.2-2' }}</span>
      </div>
    </div>

    <div class="checkout-bar d-flex justify-content-between align-items-center mt-3 p-3">
      <h3>Grand Total: <span class="price">${{ getTotalAmount() | number:'1.2-2' }}</span></h3>
      <button class="btn btn-primary" routerLink="/checkout">Proceed to Checkout</button>
    </div>
  </div>

  <ng-template #emptyCart>
    <div class="text-center p-5">
      <h3 class="mb-3">Your cart is currently empty</h3>
      <button class="btn btn-primary" routerLink="/">Browse Menu</button>
    </div>
  </ng-template>
</div>
