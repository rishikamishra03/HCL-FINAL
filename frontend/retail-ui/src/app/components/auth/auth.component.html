<div class="container mt-4 d-flex justify-content-center">
  <div class="auth-card">
    <h2 class="text-center mb-3">{{ isLoginMode ? 'Login' : 'Sign Up' }}</h2>
    
    <div *ngIf="errorMessage" class="error-msg mb-2">{{ errorMessage }}</div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group" *ngIf="!isLoginMode">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-control" [(ngModel)]="formData.fullName" name="fullName" required>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" [(ngModel)]="formData.email" name="email" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" [(ngModel)]="formData.password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">{{ isLoginMode ? 'Login' : 'Sign Up' }}</button>
    </form>
    
    <div class="text-center mt-3">
      <a href="javascript:void(0)" (click)="toggleMode()">
        {{ isLoginMode ? 'Need an account? Sign Up' : 'Already have an account? Login' }}
      </a>
    </div>
  </div>
</div>
